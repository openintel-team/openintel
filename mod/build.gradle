plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.7'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://chocolateminecraft.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // 26.x ships unobfuscated: no mappings, no remapping.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // JourneyMap fullscreen-map integration — compile-time only, optional at runtime.
    compileOnly "info.journeymap:journeymap-api-fabric:26.2-2.0.0"
    // Xaero World Map API — compile-time only, optional at runtime.
    compileOnly("xaero.map:xaeroworldmap-common-26.2:1.47.0") { transitive = false }
    compileOnly "xaero.lib:xaerolib-common-26.2:1.7.7"
    // Mod Menu config button — compile-time only; entrypoint loads only when Mod Menu is present.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Chest Tracker + Where Is It — public compile-time dependencies, optional at runtime.
    compileOnly "maven.modrinth:chest-tracker-port:NLV8VOf4"
    compileOnly "maven.modrinth:where-is-it-port:QlttCKF9"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.register('snitchDimensionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.SnitchDimensionTest'
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('apiContractTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.ApiContractTest'
}

tasks.register('cleanFontMetricsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.CleanFontMetricsTest'
}

tasks.register('cleanFontShaderTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.CleanFontShaderTest'
}

tasks.register('uiFontTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.UiFontTest'
}

tasks.register('radarLabelLayoutTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.radar.RadarLabelLayoutTest'
}

tasks.register('mapFontTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.MapFontTest'
    if (project.hasProperty('journeyMapJar')) args project.property('journeyMapJar')
}

tasks.register('hudLayoutTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.HudLayoutTest'
}

tasks.register('offlineIntelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.OfflineIntelTest'
}

tasks.register('publicationSafetyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.PublicationSafetyTest'
}

tasks.register('logoHudTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.LogoHudTest'
}

tasks.register('warTableTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.WarTableTest'
    // Raster checks use Graphics2D. Headless keeps the macOS AWT thread from holding the JVM open.
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('mapMarkerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.xaero.MapMarkerTest'
    enableAssertions = true
}

tasks.register('relicMapTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.xaero.RelicMapMathTest'
    enableAssertions = true
}

tasks.register('rangeShapeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.viz.RangeShapeTest'
    enableAssertions = true
}

tasks.register('worldOverlayShaderTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.WorldOverlayShaderTest'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}

tasks.register('worldOverlayTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.WorldOverlayTest'
    enableAssertions = true
}

tasks.register('investigateLogTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.investigate.InvestigateLogTest'
    enableAssertions = true
}

tasks.register('relicLibraryTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.relic.RelicLibraryModelTest'
    enableAssertions = true
}

tasks.register('markerSettingsTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.config.MarkerSettingsTest'
    enableAssertions = true
}

tasks.register('eventFeedLayoutTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.render.EventFeedLayoutTest'
    enableAssertions = true
}

tasks.register('versionPinTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.openintel.VersionPinTest'
    args file('gradle.properties').absolutePath, file('src/main/resources/fabric.mod.json').absolutePath
}

check.dependsOn worldOverlayTest, snitchDimensionTest, apiContractTest, cleanFontMetricsTest, uiFontTest, radarLabelLayoutTest, mapFontTest, hudLayoutTest, offlineIntelTest, publicationSafetyTest, logoHudTest, warTableTest, mapMarkerTest, relicMapTest, rangeShapeTest, investigateLogTest, relicLibraryTest, markerSettingsTest, eventFeedLayoutTest, versionPinTest

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.archives_base_name
        }
    }
}
