plugins {
    // 1.21.11 is still obfuscated. fabric-loom remaps with official Mojang mappings.
    // net.fabricmc.fabric-loom is the no-remap plugin used by unobfuscated 26.x.
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://chocolateminecraft.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // 1.21.11 ships obfuscated. Official Mojang mappings, Java 21.
    // mod* configurations remap intermediary jars onto those names and pull Mixin
    // from the loader installer JSON.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // JourneyMap fullscreen-map integration — compile-time only, optional at runtime.
    modCompileOnly "info.journeymap:journeymap-api-fabric:2.0.0-1.21.11"
    // Xaero World Map API — compile-time only, optional at runtime.
    // The 1.21.11 jars are already official-named; remapping leaves those types alone.
    modCompileOnly("xaero.map:xaeroworldmap-common-1.21.11:1.47.0") { transitive = false }
    modCompileOnly "xaero.lib:xaerolib-common-1.21.11:1.7.3"
    // Mod Menu config button — compile-time only; entrypoint loads only when Mod Menu is present.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Chest Tracker + Where Is It — public compile-time dependencies, optional at runtime.
    modCompileOnly "maven.modrinth:chest-tracker-port:T13R6ERF"
    modCompileOnly "maven.modrinth:where-is-it-port:zqQ2mdSC"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

