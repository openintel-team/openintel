tasks.register('versionPinTest') {
    def propertiesFile = layout.projectDirectory.file('gradle.properties')
    def modJson = layout.projectDirectory.file('src/main/resources/fabric.mod.json')
    inputs.file(propertiesFile)
    inputs.file(modJson)
    doLast {
        def props = new Properties()
        propertiesFile.asFile.withInputStream { props.load(it) }
        def minecraft = props.getProperty('minecraft_version')
        if (minecraft != '1.21.11') {
            throw new GradleException("minecraft_version is '${minecraft}', expected 1.21.11")
        }
        def manifest = modJson.asFile.getText('UTF-8')
        if (!manifest.contains('"minecraft": "~1.21.11"')) {
            throw new GradleException("fabric.mod.json must depend on minecraft ~1.21.11")
        }
    }
}

check.dependsOn versionPinTest, snitchDimensionTest, apiContractTest, cleanFontMetricsTest, uiFontTest, radarLabelLayoutTest, mapFontTest, hudLayoutTest, offlineIntelTest, publicationSafetyTest, logoHudTest, warTableTest, mapMarkerTest, relicMapTest, rangeShapeTest, investigateLogTest, relicLibraryTest, markerSettingsTest, eventFeedLayoutTest

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.archives_base_name
        }
    }
}
